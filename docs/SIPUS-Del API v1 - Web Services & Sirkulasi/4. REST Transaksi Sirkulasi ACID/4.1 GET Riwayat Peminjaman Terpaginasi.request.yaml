$kind: http-request
description: Mengambil daftar transaksi peminjaman buku yang berstatus dipinjam.
url: "{{base_url}}/peminjamans?status=dipinjam"
method: GET
headers:
  Accept: application/json
queryParams:
  status: dipinjam
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 1000
